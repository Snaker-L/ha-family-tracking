name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # The built-in GITHUB_TOKEN may only read in a new repository. Without this
    # the run builds the card but fails to attach it, leaving a release with no
    # file -- and nothing for HACS to install.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22, not 24. Yarn 4.12 crashes on Node 24.20 during the fetch
          # step with "The `onCancel` handler was attached after the promise
          # settled" -- caught by CI the moment the action bump pulled in a
          # newer Node 24. 22 is the LTS line and what this is developed on.
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests/integration -q

      # Builds the card straight into the integration, which then serves it.
      - run: yarn build

      # HACS installs an integration from a zip whose root is the contents of
      # custom_components/<domain>. Keeping the built bundle out of the
      # repository and inside the release is what lets both live here.
      - name: Package the integration
        run: |
          cd custom_components/family_tracking
          zip -r "$GITHUB_WORKSPACE/family_tracking.zip" . -x '*.pyc' -x '__pycache__/*'

      - name: Attach to release
        # Pinned to a commit, not a tag. A tag can be moved to point at
        # different code; this is the one third-party action here and it runs
        # with write access to the releases. Dependabot keeps the pin current.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: family_tracking.zip
