name: CI

# The release workflow only runs when a release is published, so until now a
# broken build would first show up at the worst possible moment. This runs the
# same checks on every push.
on:
  push:
    branches: [main]
  pull_request:

# Checks only read the repository; nothing here writes to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 22, not 24. Yarn 4.12 crashes on Node 24.20 during the fetch
          # step with "The `onCancel` handler was attached after the promise
          # settled" -- caught by CI the moment the action bump pulled in a
          # newer Node 24. 22 is the LTS line and what this is developed on.
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest tests/integration -q

      # Building here means a broken bundle is caught on push, not when a
      # release is already tagged.
      - run: yarn build
